spring:
  application:
    name: napa-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/napa}
    username: ${DATABASE_USERNAME:napa}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:napa_local_dev_only}}
    # Memoria: cada conexión es un proceso de PostgreSQL y memoria en la JVM. Hikari abría 10; con el tráfico
    # real sobran 5, y las ociosas se cierran dejando 1. Ajustable con DB_POOL_MAX / DB_POOL_MIN_IDLE.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: 120000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:8080}
  # Memoria: Tomcat mantenía 10 hilos de reserva y permitía 200 (cada uno con su pila). Ajustable por variable.
  tomcat:
    threads:
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:2}
      max: ${TOMCAT_THREADS_MAX:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

napa:
  fotos:
    directorio: ${NAPA_FOTOS_DIRECTORIO:./data/fotos}
    url-base: ${NAPA_FOTOS_URL_BASE:}
  pedidos:
    enabled: ${NAPA_PEDIDOS_ENABLED:true}
    tarifa:
      base: ${NAPA_PEDIDOS_TARIFA_BASE:3050}
      valor-por-km: ${NAPA_PEDIDOS_TARIFA_VALOR_POR_KM:500}
      valor-por-min: ${NAPA_PEDIDOS_TARIFA_VALOR_POR_MIN:200}
      factor-linea-recta: ${NAPA_PEDIDOS_TARIFA_FACTOR_LINEA_RECTA:1.3}
  tarifa:
    minima-defecto: ${NAPA_TARIFA_MINIMA_DEFECTO:3050}
  pagos:
    cifrado:
      clave-base64: ${NAPA_PAYMENT_ACCOUNT_ENCRYPTION_KEY:}
  web:
    allowed-origins: ${NAPA_WEB_ALLOWED_ORIGINS:}
  routing:
    ors:
      api-key: ${ORS_API_KEY:}
      base-url: ${ORS_BASE_URL:https://api.heigit.org}
  auth:
    jwt-secret: ${NAPA_JWT_SECRET:}
    access-token-ttl: ${NAPA_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${NAPA_REFRESH_TOKEN_TTL:P30D}
    admin-bootstrap:
      enabled: ${NAPA_ADMIN_BOOTSTRAP_ENABLED:false}
      name: ${NAPA_ADMIN_NAME:}
      phone: ${NAPA_ADMIN_PHONE:}
      email: ${NAPA_ADMIN_EMAIL:}
      password: ${NAPA_ADMIN_PASSWORD:}

  verification:
    provider: ${NAPA_VERIFICATION_PROVIDER:unavailable}   # unavailable | console | sms-correo
    console-code: ${NAPA_OTP_CONSOLE_CODE:}
    # Topes diarios que aplica Ñapa por canal.
    limite-diario-sms: ${NAPA_LIMITE_DIARIO_SMS:25}
    limite-diario-correo: ${NAPA_LIMITE_DIARIO_CORREO:300}
    sms-gate:
      username: ${NAPA_SMS_GATE_USERNAME:}
      password: ${NAPA_SMS_GATE_PASSWORD:}
      base-url: ${NAPA_SMS_GATE_BASE_URL:https://api.sms-gate.app}
    brevo:
      api-key: ${NAPA_BREVO_API_KEY:}
      base-url: ${NAPA_BREVO_BASE_URL:https://api.brevo.com}
      remitente-correo: ${NAPA_BREVO_SENDER_EMAIL:}
      remitente-nombre: ${NAPA_BREVO_SENDER_NAME:Ñapa}
